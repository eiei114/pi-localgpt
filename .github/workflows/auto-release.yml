name: Auto Release

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Commit or release tag whose package version is the comparison baseline
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  release:
    name: Create release for new version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for version bump
        id: check
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          TAG="v${CURRENT_VERSION}"

          if ! printf '%s' "$CURRENT_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Current package version is not stable SemVer: ${CURRENT_VERSION}." >&2
            exit 1
          fi

          if ! BASE_COMMIT=$(git rev-parse --verify --quiet --end-of-options "${BASE_REF}^{commit}"); then
            echo "Base ref does not resolve to a commit: ${BASE_REF}." >&2
            exit 1
          fi

          if ! git cat-file -e "${BASE_COMMIT}:package.json"; then
            echo "Previous package.json is not available at ${BASE_REF}." >&2
            exit 1
          fi

          PREVIOUS_VERSION=$(git show "${BASE_COMMIT}:package.json" | node -e "let input=''; process.stdin.on('data', c => input += c); process.stdin.on('end', () => console.log(JSON.parse(input).version || ''));")

          if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "package.json version did not change (${CURRENT_VERSION}); skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git tag -l "$TAG" | grep -qx "$TAG"; then
            echo "Tag $TAG already exists; skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version bump detected: ${PREVIOUS_VERSION} -> ${CURRENT_VERSION}."
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.check.outputs.released == 'true'
        shell: bash
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | head -1)
          NOTES="Released ${TAG}."
          if [ -n "$PREV_TAG" ]; then
            NOTES="${NOTES}\n\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger publish workflow
        if: steps.check.outputs.released == 'true'
        shell: bash
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          gh workflow run publish.yml --ref "$TAG" -f ref="$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
